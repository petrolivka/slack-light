[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# gtk4-rs and relm4 set the floor once they land (M0-GUI); the carried-over
# crates are fine on 1.85.
rust-version = "1.85"
license = "GPL-3.0-or-later"

# A binary people install, not a dev build.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"   # the panic hook writes a report; abort would not run it
strip = "symbols"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
tracing = "0.1"
jiff = "0.2"
unicode-width = "0.2"
unicode-segmentation = "1"
emojis = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "multipart", "stream"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "0.9"
libc = "0.2"

[package]
name = "slack-light"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A native, lightweight Slack client for Linux desktops"
repository = "https://github.com/petrolivka/slack-light"
readme = "README.md"
keywords = ["slack", "gtk", "gtk4", "chat", "client"]
categories = ["gui"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

# Only slack-light is installed. The probes are development tools with
# deliberately generic names and have no business in a user's PATH.
[features]
default = []
dev-tools = []

[lib]
name = "slack_light"
path = "src/lib.rs"

[[bin]]
name = "slack-light"
path = "src/main.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"
required-features = ["dev-tools"]

[[bin]]
name = "wscheck"
path = "src/bin/wscheck.rs"
required-features = ["dev-tools"]

[[bin]]
name = "seed"
path = "src/bin/seed.rs"
required-features = ["dev-tools"]

[dependencies]
slk-core = { path = "crates/slk-core" }
slk-api = { path = "crates/slk-api" }
slk-store = { path = "crates/slk-store" }
slk-sync = { path = "crates/slk-sync" }
slk-config = { path = "crates/slk-config" }
slk-notify = { path = "crates/slk-notify" }
slk-ui = { path = "crates/slk-ui" }
slk-theme = { path = "crates/slk-theme" }
slk-idle = { path = "crates/slk-idle" }
slk-auth = { path = "crates/slk-auth" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
