[package]
name = "spike-shell"
version = "0.0.0"
edition = "2021"
publish = false
description = "M0-GUI spike A: a relm4 shell over the real engine against the mock. Throwaway."

[dependencies]
relm4 = { version = "0.11", features = ["macros"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
slk-core = { path = "../../crates/slk-core" }
slk-api = { path = "../../crates/slk-api" }
slk-store = { path = "../../crates/slk-store" }
slk-sync = { path = "../../crates/slk-sync" }
slk-config = { path = "../../crates/slk-config" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jiff.workspace = true
